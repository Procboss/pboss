name: Run Bun Tests

# Trigger workflow on push or pull request
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      # Checkout your repository (v5: node24 runtime — v4 triggers the
      # "Node.js 20 is deprecated" runner warning)
      - name: Checkout repository
        uses: actions/checkout@v5

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9 # pin a known stable version

      # Show Bun version only
      - name: Bun version
        run: bun --version

      # Setup Deno — the runtime's e2e coverage (the deno daemon, the
      # permissions translation, the SO_REUSEPORT cluster, the deno-entry
      # bundle) skipIf-gates on `Bun.which("deno")`. A CI without the
      # binary reported 33 silent skips on the very run that shipped two
      # real bugs — the skips are why they slipped past.
      # Pinned to the version the suite is verified under (2.9.7).
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      # Show Deno version only
      - name: Deno version
        run: deno --version

      # Install dependencies
      # --frozen-lockfile: install EXACTLY the committed bun.lock. The old
      # `--force` re-resolved from the registry on every run, letting
      # floating transitives (e.g. @types/node via @types/pidusage's "*")
      # drift to whatever was "latest" that day — the moving target behind
      # the "fs/promises has no exported member 'exists'" CI failure.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build dist/ — the wrapper and upgrade e2e (the REAL node/bun/deno
      # entries, the installed-shape daemon, the old-dist realign) gate on
      # dist/cli.js existing; without the build they skip the same silent
      # way the deno suite did.
      - name: Build dist
        run: bun run build

      # Type check (TS)
      - name: Type check
        run: bun run tsc --noEmit

      # Run tests with CI flags
      - name: Run tests
        run: bun test --ci --timeout 120000
