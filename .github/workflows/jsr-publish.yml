name: Publish to JSR

# The @procboss/pboss publish pipeline (Task 242, 2026-10-10).
#
# validate: every branch push and PR runs a dry run — all JSR checks
#   (module-graph resolution, import-map completeness, slow types,
#   excluded modules) with no upload. A regression fails here instead
#   of at release time.
# publish: pushing a vX.Y.Z tag (or a manual run with dry_run unchecked)
#   publishes for real. Needs the JSR_API_TOKEN secret — a token with
#   publish scope on @procboss, created at
#   https://jsr.io/account/settings/tokens (the scope itself is created
#   once at https://jsr.io/new via the Procboss GitHub login).
#
# The local equivalents: `bun run publish:jsr:dry` (dry, dirty tree OK)
# and `bun run publish:jsr` (real, requires a clean tree + token).
# versions are kept in lockstep by tests/jsr.test.ts.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (no upload)"
        type: boolean
        default: false

jobs:
  validate:
    name: JSR dry run
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Same action the test workflow pins — the jsr CLI runs under it
      # (verified locally with bunx; it downloads its own deno binary).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: jsr publish --dry-run
        run: bunx jsr publish --dry-run

  publish:
    name: Publish @procboss/pboss
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # --provenance: publicly links the package to this build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Publish to JSR
        run: bunx jsr publish --token ${{ secrets.JSR_API_TOKEN }} --provenance
